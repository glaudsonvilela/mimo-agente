name: Verificações
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements.txt
      - run: python scripts/install_methodology.py
      - run: npm ci && npm run check && npm run build
        working-directory: frontend
      - run: node tests/test-documentation.mjs && node tests/test-learning-ui.mjs
      - run: python -m unittest test_security test_autonomy test_public_api test_learning test_qa.Tests.test_02_public_scope_and_dns test_qa.Tests.test_03_budget_resume test_qa.Tests.test_05_session_redaction test_qa.Tests.test_08_cancel_keeps_pending_queue
        working-directory: backend
      - run: git diff --exit-code -- frontend/dist/app.js
